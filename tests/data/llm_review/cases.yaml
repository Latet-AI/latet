templates:
  - id: tpl-it-visita
    kind: user_text
    tags: [prose, it]
    text: "Domani accompagno {rel} {name} dal dottor {doctor} per {condition}: ricordamelo alle 8 e scrivimi cosa portare."
    slots: {name: person, doctor: person, condition: health}
    fills:
      - {rel: mia madre, name: Rosa Marino, doctor: Enrico Sala, condition: la chemioterapia}
      - {rel: mio padre, name: Franco Villa, doctor: Luisa Moretti, condition: il controllo del Parkinson}
      - {rel: mia suocera, name: Adele Ricci, doctor: Pietro Gallo, condition: la dialisi}

  - id: tpl-en-call
    kind: user_text
    tags: [prose, en]
    text: "Set up a call with {name} from {company} about the {project} rollout; she prefers mornings and her direct line is {phone}."
    slots: {name: person, company: org, project: confidential, phone: phone}
    fills:
      - {name: Hannah Becker, company: Northwind Freight, project: Bluebird, phone: +44 20 7946 0958}
      - {name: Sofia Lindgren, company: Harbor Lane Insurance, project: Atlas, phone: +1 212 555 0187}
      - {name: Amara Okoye, company: Greenfield Dairies, project: Lighthouse, phone: +353 1 555 0142}

  - id: tpl-it-consegna
    kind: user_text
    tags: [prose, it]
    text: "Consegna per {name}, {street}, {cap} {city}: lasciare al portiere se non c'è nessuno. Traduci la nota in tedesco."
    slots: {name: person, street: address, cap: address}
    ok_slots: [city]
    fills:
      - {name: Alessio Bruno, street: via Mazzini 22, cap: "37121", city: Verona}
      - {name: Ilaria Conti, street: corso Vittorio Emanuele 130, cap: "80121", city: Napoli}
      - {name: Gabriele Fontana, street: viale Europa 7, cap: "06034", city: Foligno}

  - id: tpl-en-secret
    kind: user_text
    tags: [prose, en]
    text: "the {thing} password is {secret}, don't lose it, and the recovery email is {email}. write me a checklist to rotate it."
    slots: {secret: secret, email: email}
    fills:
      - {thing: router, secret: Mango-Delta-391, email: k.tanaka@example.org}
      - {thing: NAS, secret: violet_harbor_2026, email: ops.backup@example.net}
      - {thing: alarm panel, secret: 7731-brick-lane, email: home.alarm@example.com}

  - id: tpl-it-debito
    kind: user_text
    tags: [prose, it]
    text: "{name} mi deve ancora {amount} per il viaggio a {place}; scrivigli un messaggio simpatico per ricordarglielo."
    slots: {name: person, amount: financial}
    ok_slots: [place]
    fills:
      - {name: Riccardo, amount: 640 euro, place: Lisbona}
      - {name: la Bea, amount: 1.200 euro, place: Tenerife}
      - {name: zio Gino, amount: 300 euro, place: Matera}

  - id: tpl-en-confidence
    kind: user_text
    tags: [prose, en]
    text: "{name} told me in confidence that {fact}; how should I adjust her schedule without telling the team?"
    slots: {name: person, fact: health}
    fills:
      - {name: Laura Mitchell, fact: she is pregnant and due in March}
      - {name: Ines Duarte, fact: she is going through IVF treatment}
      - {name: Grace Liu, fact: she has been diagnosed with epilepsy}

  - id: tpl-it-commento
    kind: tool_result
    tags: [code, it]
    text: "# chiedere a {name} ({role} di {company}) se {topic}\n{code}\n"
    slots: {name: person, company: org}
    fills:
      - {name: Ilaria Moretti, role: responsabile IT, company: Vetreria Adriatica, topic: possiamo usare la VPN, code: VPN_ENABLED = False}
      - {name: Nicola Serra, role: commercialista, company: Studio Serra & Associati, topic: l'IVA va al 22%, code: VAT = 0.22}
      - {name: Martina Pace, role: avvocata, company: Pace Legal, topic: possiamo tenere i log 90 giorni, code: LOG_RETENTION_DAYS = 90}

  - id: tpl-en-document
    kind: user_text
    tags: [prose, en]
    text: "My {doc} number is {num} and it expires on {date}; fill in the {form} with it."
    slots: {num: id}
    ok_slots: [date]
    fills:
      - {doc: driving licence, num: MORGA753116SM9IJ, date: 2029-04-30, form: rental form}
      - {doc: membership card, num: GYM-0042-7781, date: 2027-01-15, form: transfer request}
      - {doc: student ID, num: S2023-118457, date: 2027-09-30, form: discount application}

  - id: tpl-it-cliente
    kind: user_text
    tags: [prose, it]
    text: "Il cliente {client} ci ha chiesto di non nominare {project} nelle demo finché non firmano: aggiorna le slide togliendo i riferimenti."
    slots: {client: org, project: confidential}
    fills:
      - {client: Pastificio Sanna, project: il progetto Granaio}
      - {client: Cantine Ferraris, project: Operazione Vendemmia}
      - {client: Officine Moro, project: il prototipo Ardesia}

  - id: tpl-en-school
    kind: user_text
    tags: [prose, en]
    text: "My son {name} has {condition} and his teacher {teacher} keeps forgetting his {need}; help me write a firm but polite email."
    slots: {name: person, condition: health, teacher: person}
    fills:
      - {name: Oliver, condition: ADHD, teacher: Mr. Hargreaves, need: extra time in tests}
      - {name: Noah, condition: type 1 diabetes, teacher: Ms. Delgado, need: snack breaks}
      - {name: Leo, condition: a severe nut allergy, teacher: Mrs. Brennan, need: EpiPen}

  - id: tpl-log-shipping
    kind: tool_result
    tags: [log]
    text: "{ts} INFO order {order} shipped to {name}, {street}, {city}\n{ts} INFO label printed for order {order}"
    slots: {name: person, street: address}
    ok_slots: [order, city]
    fills:
      - {ts: "2026-09-29 18:02:11", order: "#A-55120", name: Paola Sartori, street: via Nizza 41, city: Torino}
      - {ts: "2026-09-29 18:05:40", order: "#A-55121", name: Kevin O'Brien, street: 14 Harcourt Street, city: Dublin}
      - {ts: "2026-09-29 18:07:02", order: "#A-55122", name: Yuki Saito, street: 2-11-3 Jingumae, city: Tokyo}

  - id: tpl-en-bio
    kind: user_text
    tags: [prose, en]
    text: "{name} asked us to remove {fact} from the newsletter bio before it goes out; rewrite the paragraph without it."
    slots: {name: person, fact: sensitive}
    fills:
      - {name: Daniel Avraham, fact: the mention of his conversion to Judaism}
      - {name: Chloe Martin, fact: her membership in the Green Party}
      - {name: Sam Rivera, fact: that he came out as gay last year}

