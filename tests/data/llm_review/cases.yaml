# Cases for scripts/llm_review_bench.py: every value here is invented.
#
# expect: values the reviewer should report, as [text, category]. A value the deterministic engine
#         masks already is not counted against the reviewer.
# ok:     values it may report or not (borderline, public, or obvious example data).
# block:  whether the whole text should be stopped (null: not scored).
# tags:   prose | code | log | data | benign | injection | block | masked | latency
#
# {GH_PAT} and {AWS_KEY} stand for fake tokens the bench fills in (kept out of the file so no
# secret scanner mistakes them for real ones).
#
# Categories: person address phone email id health sensitive financial secret org confidential

